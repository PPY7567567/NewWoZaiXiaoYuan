name: 自动打卡定时任务
on:
  workflow_dispatch: # 只允许手动、外部API调用触发，删除schedule

jobs:
  run-task:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install -i https://pypi.tuna.tsinghua.edu.cn/simple pyyaml requests yagmail pycryptodome

      - name: 运行打卡脚本
        run: python WoZaiXiaoYuan.py
